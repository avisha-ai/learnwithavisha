# LWA render robot: renders one episode (2D + 3D + wide) on a GitHub runner, puts the web files
# into site/, rebuilds the site and commits them back to the SAME branch, so the Git-connected
# Vercel project builds a preview. Never runs on main. No secrets needed (Kokoro runs offline).
name: Render episode

on:
  workflow_dispatch:
    inputs:
      episode:
        description: "Episode id, e.g. ep02 (runs pipeline/ep02_v2_pipeline.py --wide)"
        required: true
        default: ep02
  push:
    branches-ignore: [main]
    paths: ["episodes/specs/**"]        # future: spec files (episodes/specs/s1eNN_slug.yaml)

permissions:
  contents: write                       # to commit the rendered web files back to this branch

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

env:
  KOKORO_DIR: ${{ github.workspace }}/.kokoro
  # Kokoro v1.0 model files (kokoro-onnx README → releases, tag model-files-v1.1)
  KOKORO_URL: https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1
  PYVISTA_OFF_SCREEN: "true"
  MAX_WEB_MB: "5"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Refuse to run on main
        if: github.ref_name == 'main'
        run: |
          echo "::error::The render robot never runs on main. Use a branch (e.g. ci-render or ep/NN-slug)."
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 2                # push trigger compares HEAD~1..HEAD for the changed spec

      - name: Which episode
        id: ep
        run: |
          EP="${{ github.event.inputs.episode }}"
          if [ -z "$EP" ]; then        # push: take the newest changed spec, s1e03_x.yaml → ep03
            SPEC=$(git diff --name-only HEAD~1 HEAD -- episodes/specs | tail -1 || true)
            EP="ep$(basename "$SPEC" | sed -n 's/^s1e\([0-9][0-9]\).*/\1/p')"
          fi
          SCRIPT="pipeline/${EP}_v2_pipeline.py"
          if [ ! -f "$SCRIPT" ]; then
            echo "::notice::No $SCRIPT yet (spec runner not built) — nothing to render."; echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          SLUG=$(sed -n 's/^EP_SLUG *= *"\([^"]*\)".*/\1/p' "$SCRIPT")
          [ -n "$SLUG" ] || { echo "::error::EP_SLUG not found in $SCRIPT"; exit 1; }
          echo "Episode $EP · $SCRIPT · $SLUG"
          { echo "ep=$EP"; echo "script=$SCRIPT"; echo "slug=$SLUG"; echo "skip=0"; } >> "$GITHUB_OUTPUT"

      - name: System packages (ffmpeg, fonts, GL)
        if: steps.ep.outputs.skip == '0'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation \
            xvfb libgl1 libgl1-mesa-dri libglx-mesa0 libxrender1 \
            libpango1.0-dev libcairo2-dev pkg-config     # pango/cairo: manim in requirements.txt

      - uses: pyvista/setup-headless-display-action@v3
        if: steps.ep.outputs.skip == '0'

      - uses: actions/setup-python@v5
        if: steps.ep.outputs.skip == '0'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Python packages
        if: steps.ep.outputs.skip == '0'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Kokoro model cache
        if: steps.ep.outputs.skip == '0'
        id: kcache
        uses: actions/cache@v4
        with:
          path: .kokoro
          key: kokoro-v1.0-model-files-v1.1

      - name: Download Kokoro model (cache miss only)
        if: steps.ep.outputs.skip == '0' && steps.kcache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .kokoro
          curl -fL --retry 3 -o .kokoro/kokoro-v1.0.onnx "$KOKORO_URL/kokoro-v1.0.onnx"
          curl -fL --retry 3 -o .kokoro/voices-v1.0.bin  "$KOKORO_URL/voices-v1.0.bin"
          ls -la .kokoro && sha256sum .kokoro/*      # pin these values after the first good run

      - name: TTS clip cache
        if: steps.ep.outputs.skip == '0'
        uses: actions/cache@v4
        with:
          path: out/tts_cache
          key: tts-${{ steps.ep.outputs.ep }}-${{ hashFiles(steps.ep.outputs.script) }}
          restore-keys: tts-${{ steps.ep.outputs.ep }}-

      - name: Apply pending pipeline patches (Linux fonts, KOKORO_DIR, script fixes)
        if: steps.ep.outputs.skip == '0'
        run: |
          shopt -s nullglob
          for p in pipeline/patches/*.patch; do
            if git apply --reverse --check "$p" 2>/dev/null; then echo "already applied: $p";
            else git apply "$p" && echo "applied: $p"; fi
          done

      - name: Render 2D + 3D + wide
        if: steps.ep.outputs.skip == '0'
        run: |
          python -c "import pyvista as pv; pv.Plotter(off_screen=True).screenshot('/tmp/gl_check.png'); print('GL ok')"
          python "${{ steps.ep.outputs.script }}" --wide

      - name: Web files into site/
        if: steps.ep.outputs.skip == '0'
        env:
          S: ${{ steps.ep.outputs.slug }}
        run: |
          mkdir -p site/media site/static/captions
          # 2D: the pipeline's ≤5 MB 720x1280 web file and its chosen poster
          cp "out/${S}_web.mp4"    "site/media/${S}.mp4"
          cp "out/${S}_poster.jpg" "site/media/${S}_poster.jpg"
          cp "out/${S}.vtt"        "site/static/captions/${S}.vtt"
          # 3D panel for the landing card: 640x720, no audio, CRF 28, faststart (~2–3 MB)
          ffmpeg -y -loglevel error -i "out/${S}_3d.mp4" -vf "scale=640:720:flags=lanczos" -an \
            -c:v libx264 -crf 28 -preset slow -pix_fmt yuv420p -movflags +faststart "site/media/${S}_3d.mp4"
          ffmpeg -y -loglevel error -ss 5 -i "site/media/${S}_3d.mp4" -frames:v 1 -q:v 2 "site/media/${S}_3d_poster.jpg"
          # size gate: every committed video ≤ MAX_WEB_MB
          for f in site/media/*.mp4; do
            mb=$(du -m "$f" | cut -f1); echo "$f ${mb} MB"
            if [ "$(stat -c %s "$f")" -gt $((MAX_WEB_MB*1000000)) ]; then echo "::error::$f is over ${MAX_WEB_MB} MB"; exit 1; fi
          done

      - name: Back-fill media of other released episodes from the live site
        if: steps.ep.outputs.skip == '0'
        run: |
          # Before the robot, EP01's videos were uploaded from the Mac and are not in git.
          # A git-built Vercel deploy would miss them, so copy any missing file from lwa.avisha.ai once.
          python - <<'PY'
          import json, pathlib, urllib.request
          site = pathlib.Path("site")
          for ep in json.loads((site / "episodes.json").read_text())["episodes"]:
              if ep["status"] != "released":
                  continue
              for key, rel in (ep.get("video") or {}).items():
                  dst = site / ("static" if rel.startswith("captions/") else "") / rel
                  if dst.exists():
                      continue
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  url = "https://lwa.avisha.ai/" + rel
                  print("back-fill", url)
                  urllib.request.urlretrieve(url, dst)
          PY

      - name: Build site
        if: steps.ep.outputs.skip == '0'
        run: python3 site/build.py

      - name: Commit web files back to this branch
        if: steps.ep.outputs.skip == '0'
        run: |
          git config user.name  "LWA render robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/media site/static/captions site/public pipeline
          git status --short
          if git diff --cached --quiet; then echo "nothing new to commit"; exit 0; fi
          git commit -m "render robot: ${{ steps.ep.outputs.ep }} web files (run ${{ github.run_id }})"
          git push        # GITHUB_TOKEN pushes do not start another workflow run, so no loop

      - name: Upload all outputs
        if: always() && steps.ep.outputs.skip == '0'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ep.outputs.slug }}-outputs
          retention-days: 14
          if-no-files-found: warn
          path: |
            out/*.mp4
            out/*.jpg
            out/*.png
            out/*.srt
            out/*.vtt
            out/*.ass
            site/media/
