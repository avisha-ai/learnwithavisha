<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1250" viewBox="0 0 2000 1250"><defs><marker id="aI" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 z" fill="#1F2A44"/></marker><marker id="aR" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 z" fill="#C0392B"/></marker><marker id="aT" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 z" fill="#0F8B8D"/></marker><marker id="aA" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 z" fill="#D99A00"/></marker><marker id="aB" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 z" fill="#2B6CB0"/></marker></defs><rect width="2000" height="1250" fill="#F7F6F2"/><text x="60" y="80" font-family="Menlo, Consolas, monospace" font-size="24" fill="#0F8B8D" text-anchor="start" font-weight="700">PLANT MYSTERIES  ·  EP 02  ·  STORYBOARD (9:16)</text><text x="60" y="140" font-family="Helvetica, Arial, sans-serif" font-size="54" fill="#1F2A44" text-anchor="start" font-weight="700">Four beats, 0 to 74 seconds</text><rect x="60" y="200" width="400" height="711" fill="#FFFFFF" stroke="#1F2A44" stroke-width="3" rx="10"/><text x="60" y="955" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#1F2A44" text-anchor="start" font-weight="700">1  HOOK</text><text x="60" y="989" font-family="Menlo, Consolas, monospace" font-size="22" fill="#0F8B8D" text-anchor="start" font-weight="400">0:00–0:04.5</text><text x="60" y="1025" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#5B6B82" text-anchor="start" font-weight="400">“Nothing broke. Nothing</text><text x="60" y="1055" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#5B6B82" text-anchor="start" font-weight="400">leaked. Yet the outlet is</text><text x="60" y="1085" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#5B6B82" text-anchor="start" font-weight="400">three degrees colder.”</text><rect x="540" y="200" width="400" height="711" fill="#FFFFFF" stroke="#1F2A44" stroke-width="3" rx="10"/><text x="540" y="955" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#1F2A44" text-anchor="start" font-weight="700">2  SAME PLANT</text><text x="540" y="989" font-family="Menlo, Consolas, monospace" font-size="22" fill="#0F8B8D" text-anchor="start" font-weight="400">0:04.5–0:15.5</text><text x="540" y="1025" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#5B6B82" text-anchor="start" font-weight="400">“Same exchanger, same flows.</text><text x="540" y="1055" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#5B6B82" text-anchor="start" font-weight="400">Clean, it left at 63. Now 60.”</text><rect x="1020" y="200" width="400" height="711" fill="#FFFFFF" stroke="#1F2A44" stroke-width="3" rx="10"/><text x="1020" y="955" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#1F2A44" text-anchor="start" font-weight="700">3  THE LAYER</text><text x="1020" y="989" font-family="Menlo, Consolas, monospace" font-size="22" fill="#0F8B8D" text-anchor="start" font-weight="400">0:15.5–0:49</text><text x="1020" y="1025" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#5B6B82" text-anchor="start" font-weight="400">“0.08 mm deposit. Resistances</text><text x="1020" y="1055" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#5B6B82" text-anchor="start" font-weight="400">in series add. U 500 → 417.”</text><rect x="1500" y="200" width="400" height="711" fill="#FFFFFF" stroke="#1F2A44" stroke-width="3" rx="10"/><text x="1500" y="955" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#1F2A44" text-anchor="start" font-weight="700">4  THE PAYOFF</text><text x="1500" y="989" font-family="Menlo, Consolas, monospace" font-size="22" fill="#0F8B8D" text-anchor="start" font-weight="400">0:49–1:14</text><text x="1500" y="1025" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#5B6B82" text-anchor="start" font-weight="400">“About 6% less heat. Watch</text><text x="1500" y="1055" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#5B6B82" text-anchor="start" font-weight="400">temperatures. Next: plates in</text><text x="1500" y="1085" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#5B6B82" text-anchor="start" font-weight="400">the shell.”</text><text x="260.0" y="270" font-family="Menlo, Consolas, monospace" font-size="22" fill="#5B6B82" text-anchor="middle" font-weight="400">COLD OUTLET</text><circle cx="260.0" cy="380" r="56" fill="#F7F6F2" stroke="#1F2A44" stroke-width="2.5"/><line x1="204.0" y1="380" x2="316.0" y2="380" stroke="#1F2A44" stroke-width="1.5"/><text x="260.0" y="374" font-family="Menlo, Consolas, monospace" font-size="20" fill="#1F2A44" text-anchor="middle" font-weight="700">TI</text><text x="260.0" y="402" font-family="Menlo, Consolas, monospace" font-size="20" fill="#1F2A44" text-anchor="middle" font-weight="700">102</text><text x="150.0" y="540" font-family="Helvetica, Arial, sans-serif" font-size="46" fill="#0F8B8D" text-anchor="middle" font-weight="700">63 °C</text><line x1="220.0" y1="528" x2="290.0" y2="528" stroke="#1F2A44" stroke-width="4" marker-end="url(#aI)"/><text x="390.0" y="540" font-family="Helvetica, Arial, sans-serif" font-size="46" fill="#D99A00" text-anchor="middle" font-weight="700">60 °C</text><text x="260.0" y="670" font-family="Helvetica, Arial, sans-serif" font-size="44" fill="#1F2A44" text-anchor="middle" font-weight="700">3 °C colder</text><text x="260.0" y="720" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#5B6B82" text-anchor="middle" font-weight="400">Nothing broke.</text><text x="260.0" y="840" font-family="Menlo, Consolas, monospace" font-size="18" fill="#5B6B82" text-anchor="middle" font-weight="400" font-style="italic">burned-in caption</text><rect x="570" y="440" width="340" height="140" fill="#EEF1F5" stroke="#1F2A44" stroke-width="3" rx="10"/><rect x="550" y="485" width="380" height="50" fill="none" stroke="#1F2A44" stroke-width="3" rx="0"/><text x="570" y="420" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#C0392B" text-anchor="start" font-weight="700">Hot in 90 °C</text><text x="910" y="630" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#2B6CB0" text-anchor="end" font-weight="700">Cold in 10 °C</text><text x="740.0" y="330" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1F2A44" text-anchor="middle" font-weight="700">SAME EXCHANGER</text><text x="740.0" y="370" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1F2A44" text-anchor="middle" font-weight="700">SAME FLOWS</text><text x="740.0" y="720" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#0F8B8D" text-anchor="middle" font-weight="700">Clean: cold out 63 °C</text><text x="740.0" y="765" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#D99A00" text-anchor="middle" font-weight="700">Now: 60 °C</text><rect x="1060" y="320" width="320" height="120" fill="#CFE9E9" stroke="#0F8B8D" stroke-width="2.5" rx="0"/><rect x="1060" y="440" width="320" height="22" fill="#D99A00" stroke="#D99A00" stroke-width="0" rx="0"/><text x="1220.0" y="390" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1F2A44" text-anchor="middle" font-weight="400">tube wall + films</text><text x="1220.0" y="492" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#D99A00" text-anchor="middle" font-weight="700">deposit 0.08 mm</text><line x1="1090" y1="280" x2="1090" y2="530" stroke="#1F2A44" stroke-width="4" marker-end="url(#aI)"/><text x="1110" y="300" font-family="Menlo, Consolas, monospace" font-size="26" fill="#1F2A44" text-anchor="start" font-weight="700">Q</text><rect x="1050" y="600" width="250" height="44" fill="#CFE9E9" stroke="#0F8B8D" stroke-width="2" rx="0"/><rect x="1300" y="600" width="50" height="44" fill="#D99A00" stroke="#D99A00" stroke-width="2" rx="0"/><text x="1050" y="680" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1F2A44" text-anchor="start" font-weight="700">0.0020 + 0.0004 = 0.0024</text><text x="1220.0" y="780" font-family="Helvetica, Arial, sans-serif" font-size="38" fill="#D99A00" text-anchor="middle" font-weight="700">U: 500 → 417</text><text x="1220.0" y="825" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#5B6B82" text-anchor="middle" font-weight="400">W/(m²·K)</text><text x="1700.0" y="320" font-family="Helvetica, Arial, sans-serif" font-size="34" fill="#1F2A44" text-anchor="middle" font-weight="700">ε  0.67 → 0.63</text><text x="1700.0" y="430" font-family="Helvetica, Arial, sans-serif" font-size="90" fill="#D99A00" text-anchor="middle" font-weight="700">−6 %</text><text x="1700.0" y="485" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#1F2A44" text-anchor="middle" font-weight="400">heat moved</text><text x="1700.0" y="580" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#0F8B8D" text-anchor="middle" font-weight="700">Watch the temperatures,</text><text x="1700.0" y="615" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#0F8B8D" text-anchor="middle" font-weight="700">not just the flow.</text><line x1="1540" y1="700" x2="1860" y2="700" stroke="#D9DCE3" stroke-width="2"/><text x="1700.0" y="770" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#1F2A44" text-anchor="middle" font-weight="700">NEXT: Why plates</text><text x="1700.0" y="805" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#1F2A44" text-anchor="middle" font-weight="700">inside the shell?</text><line x1="472" y1="555.5" x2="528" y2="555.5" stroke="#5B6B82" stroke-width="4" marker-end="url(#aI)"/>